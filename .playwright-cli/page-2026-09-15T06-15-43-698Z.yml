                  - /url: "#如何给老师演示"
              - paragraph [ref=e415]:
                - strong [ref=e416]: 方式 A · 当面演示（推荐，零配置）
                - text: 同一台手机上切换账号即可演示完整闭环：
              - list [ref=e417]:
                - listitem [ref=e418]: 用学生账号登录 → 勾选教材 → 提交
                - listitem [ref=e419]: 退出 → 用管理员账号登录 → 查看统计（比例实时变化）→ 导出表格
              - blockquote [ref=e420]:
                - paragraph [ref=e421]: Mock 数据存在本机 storage，同一台设备上所有角色共享数据，切换账号能看到对方提交的结果。
              - paragraph [ref=e422]:
                - strong [ref=e423]: 方式 B · 远程扫码体验（需要 AppID）
              - list [ref=e424]:
                - listitem [ref=e425]:
                  - text: 注册小程序账号：
                  - link "mp.weixin.qq.com" [ref=e426] [cursor=pointer]:
                    - /url: https://mp.weixin.qq.com
                  - text: → 立即注册 → 小程序（个人主体免费），拿到 AppID 填入
                  - code [ref=e427]: project.config.json
                - listitem [ref=e428]: 开发者工具右上角「上传」→ 微信公众平台「版本管理」→ 将上传版本设为「体验版」
                - listitem [ref=e429]: 「成员管理」→ 添加老师的微信号 为体验成员
                - listitem [ref=e430]: 生成体验版二维码发给老师，微信扫码即可使用
              - blockquote [ref=e431]:
                - paragraph [ref=e432]: 注意：每台手机的 mock 数据相互独立，老师手机里是全新的种子数据，需自行走一遍「管理员发布 → 学生提交 → 管理员看统计」流程。
